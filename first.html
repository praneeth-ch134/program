
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praneeth - My Profile</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            text-align: center;
            margin: 0;
            padding: 40px 15px;
        }

        .profile {
            background-color: white;
            max-width: 450px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 12px #cccccc;
        }

        h1 {
            color: #2563eb;
        }

        p {
            color: #444;
            line-height: 1.6;
        }

        .tag {
            display: inline-block;
            background-color: #dbeafe;
            color: #1d4ed8;
            padding: 8px 14px;
            border-radius: 20px;
            margin: 5px;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1e40af;
        }
    </style>
</head>

<body>

    <div class="profile">
        <h1>Hi, I'm Praneeth!</h1>

        <p>
            I am a third-year Computer Science student
            at SR University, Warangal.
        </p>

        <h3>About Me</h3>
        <p>
            I am interested in programming, Data Structures
            and Algorithms, and software development.
        </p>

        <h3>My Skills & Interests</h3>
        <span class="tag">C++</span>
        <span class="tag">DSA</span>
        <span class="tag">HTML & CSS</span>
        <span class="tag">Java</span>

        <br><br>

        <button onclick="alert('Thanks for visiting my profile!')">
            Say Hello
        </button>
    </div>

</body>
</html>
